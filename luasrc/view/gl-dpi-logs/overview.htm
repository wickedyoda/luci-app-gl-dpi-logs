<%+header%>

<h2 name="content"><%:DPI Logs%></h2>

<div id="dpi-stats-container">Loading...</div>

<script type="text/javascript">//<![CDATA[
function refreshStats() {
    var container = document.getElementById('dpi-stats-container');
    if (!container) return;
    XHR.get('<%=url("admin/services/gl_dpi_logs_data")%>', null, function(json) {
        if (!container || !json) return;
        var html = '<div class="dpi-section">';
        html += '<h3>DPI Statistics</h3>';
        if (json.qos_stats) {
            for (var key in json.qos_stats) {
                if (key !== 'date') {
                    html += '<div class="stat-item"><label>' + key + ':</label> <span>' + json.qos_stats[key] + '</span></div>';
                }
            }
        }
        html += '</div>';
        html += '<div class="dpi-section">';
        html += '<h3>Content Filtering</h3>';
        if (json.content_protection) {
            for (var key in json.content_protection) {
                if (key !== 'date') {
                    html += '<div class="stat-item"><label>' + key + ':</label> <span>' + json.content_protection[key] + '</span></div>';
                }
            }
        }
        html += '</div>';
        html += '<div class="dpi-section">';
        html += '<h3>Firewall Drop Counters</h3>';
        html += '<div class="stat-item">iptables output available via CLI</div>';
        html += '</div>';
        html += '<div class="dpi-section">';
        html += '<h3>Netify DPI Engine</h3>';
        if (json.netify) {
            html += '<div class="stat-item"><label>Blocked Domains:</label> <span>' + (json.blocked_domains ? json.blocked_domains.length : 0) + '</span></div>';
            html += '<div class="stat-item"><label>Active Connections:</label> <span>' + (json.netify.active_connections || 0) + '</span></div>';
            html += '<div class="stat-item"><label>Detections:</label> <span>' + (json.netify.detections || 0) + '</span></div>';
        } else {
            html += '<div class="stat-item">Netify data not available</div>';
        }
        html += '</div>';
        html += '<div class="dpi-section">';
        html += '<h3>Export Options</h3>';
        html += '<button onclick="exportData(\'json\')" class="btn btn-primary" style="margin-right:10px;">Export JSON</button>';
        html += '<button onclick="exportData(\'csv\')" class="btn btn-secondary">Export CSV</button>';
        html += '</div>';
        html += '<div class="dpi-section">';
        html += '<h3>Raw Statistics Files</h3>';
        html += '<div class="stat-item"><label>QoS Stats:</label> <span>/tmp/qos_stats</span></div>';
        html += '<div class="stat-item"><label>Content Protection:</label> <span>/tmp/content_protection_stats</span></div>';
        html += '</div>';
        container.innerHTML = html;
    });
}

function exportData(format) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin/services/gl_dpi_logs_export")%>?format=' + format, true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.responseType = 'blob';
    xhr.onload = function() {
        if (xhr.status === 200) {
            var blob = xhr.response;
            var timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            var filename = 'dpi_export_' + timestamp + '.' + format;
            if (window.navigator.msSaveOrOpenBlob) {
                window.navigator.msSaveOrOpenBlob(blob, filename);
            } else {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        } else {
            alert('Export failed: HTTP ' + xhr.status);
        }
    };
    xhr.onerror = function() {
        alert('Export failed: network error');
    };
    xhr.send();
}

setInterval(refreshStats, 30000);
document.addEventListener('DOMContentLoaded', refreshStats);
//]]></script>

<%+footer%>
