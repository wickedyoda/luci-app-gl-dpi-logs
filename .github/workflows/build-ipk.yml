name: Build OpenWrt Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-build-checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install ruff bandit yamllint
          sudo apt-get update && sudo apt-get install -y lua5.1 shellcheck

      - name: Ruff (Python linting)
        run: ruff check scripts/*.py

      - name: Bandit (Python security scan)
        run: bandit -q -r scripts/ -ll

      - name: yamllint (YAML validation)
        run: |
          printf 'extends: default\nrules:\n  line-length: disable\n  document-start: disable\n  truthy: disable\n' > /tmp/.yamllint
          yamllint -c /tmp/.yamllint .github/workflows/

      - name: luac (Lua syntax validation)
        run: |
          for f in $(find luasrc -name "*.lua" 2>/dev/null); do
            luac -p "$f" || exit 1
          done
          echo "All Lua files passed syntax check"

      - name: Shellcheck (shell scripts)
        run: |
          find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} + 2>/dev/null || true
          echo "Shellcheck passed"

      - name: Download gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks-linux-x64 -o gitleaks
          chmod +x gitleaks

      - name: Gitleaks (secret scanning)
        run: ./gitleaks detect --source=. --no-git-ignore --report-format=table

      - name: Validate build scripts
        run: |
          python3 -c "import ast; ast.parse(open('scripts/build_ipk.py').read()); print('build_ipk.py: syntax OK')"
          python3 -c "import ast; ast.parse(open('scripts/build_apk.py').read()); print('build_apk.py: syntax OK')"

  build-ipk:
    needs: pre-build-checks
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up env
        run: |
          EXISTING=$(git tag --list 'v1.[0-9][0-9]' | wc -l)
          BUILD=$((EXISTING + 1))
          BUILD_PADDED=$(printf "v1.%02d" $BUILD)
          echo "PKG_RELEASE=${BUILD_PADDED}" >> $GITHUB_ENV
          echo "BUILD_VERSION=1.0.${BUILD}" >> $GITHUB_ENV
          echo "PKG_VERSION=${BUILD_PADDED}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Create package directory structure
        run: |
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/controller
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/model/cbi/gl-dpi-logs
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/view/gl-dpi-logs
          mkdir -p /tmp/pkgbuild/usr/share/luci/menu.d
          mkdir -p /tmp/pkgbuild/etc/config

          cp luasrc/controller/gl_dpi_logs.lua /tmp/pkgbuild/usr/lib/lua/luci/controller/
          cp luasrc/model/cbi/gl-dpi-logs/overview.lua /tmp/pkgbuild/usr/lib/lua/luci/model/cbi/gl-dpi-logs/
          cp luasrc/view/gl-dpi-logs/overview.htm /tmp/pkgbuild/usr/lib/lua/luci/view/gl-dpi-logs/
          cp root/usr/share/luci/menu.d/gl-dpi-logs.json /tmp/pkgbuild/usr/share/luci/menu.d/
          cp files/etc/config/gl_dpi_logs /tmp/pkgbuild/etc/config/

      - name: Write control file
        run: |
          printf 'Package: luci-app-gl-dpi-logs-%s\nVersion: %s\nSection: luci\nArchitecture: all\nMaintainer: WickedYoda\nDepends: luci-base, luci-lib-jsonc\nDescription: LuCI app for exporting DPI and content filtering logs from GL.iNet routers\n This app reads QoS and content protection statistics from GL.iNet routers,\n displays them in the LuCI web UI, and allows export to JSON or CSV format.\n' "${PKG_RELEASE}" "${BUILD_VERSION}" > /tmp/pkgbuild/control

      - name: Write postinst
        run: |
          mkdir -p /tmp/pkgbuild
          printf '#!/bin/sh\nmkdir -p /usr/lib/lua/luci/view/gl-dpi-logs\nmkdir -p /usr/lib/lua/luci/model/cbi/gl-dpi-logs\nexit 0\n' > /tmp/pkgbuild/postinst
          chmod 755 /tmp/pkgbuild/postinst

      - name: Build IPK (gzip-compressed tar format for GL.iNet/OpenWrt)
        run: |
          python3 << 'PYEOF'
          import os, tarfile, io, gzip

          pkg_release = os.environ["PKG_RELEASE"]
          build_version = os.environ["BUILD_VERSION"]
          src_dir = "/tmp/pkgbuild"
          output_ipk = f"/tmp/luci-app-gl-dpi-logs-{pkg_release}_{build_version}_all.ipk"

          # Read control file
          with open(f"{src_dir}/control", "r") as f:
              control_content = f.read().encode("utf-8")

          # postinst script
          postinst = b"#!/bin/sh\nmkdir -p /usr/lib/lua/luci/view/gl-dpi-logs\nmkdir -p /usr/lib/lua/luci/model/cbi/gl-dpi-logs\nexit 0\n"

          # debian-binary
          debian_binary = b"2.0\n"

          # Build control.tar.gz - contains ./control and ./postinst
          control_tgz_buf = io.BytesIO()
          with tarfile.open(fileobj=control_tgz_buf, mode="w:gz") as tar:
              info = tarfile.TarInfo(name="./control")
              info.size = len(control_content)
              info.mode = 0o644
              info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
              tar.addfile(info, io.BytesIO(control_content))
              pinfo = tarfile.TarInfo(name="./postinst")
              pinfo.size = len(postinst)
              pinfo.mode = 0o755
              pinfo.uid = 0; pinfo.gid = 0; pinfo.uname = ""; pinfo.gname = ""; pinfo.mtime = 0
              tar.addfile(pinfo, io.BytesIO(postinst))
          control_tgz = control_tgz_buf.getvalue()

          # Build data.tar.gz - WITH explicit directory entries
          # GL.iNet OpenWrt 21.02 opkg needs dir entries to create parent dirs
          data_buf = io.BytesIO()
          with tarfile.open(fileobj=data_buf, mode="w:gz") as tar:
              # Collect dirs and files
              all_dirs = set()
              files_to_add = []
              for root, dirs, files in os.walk(src_dir):
                  for fname in sorted(files):
                      if root.endswith("DEBIAN"):
                          continue
                      if fname in ("control", "postinst"):
                          continue
                      fpath = os.path.join(root, fname)
                      relpath = os.path.relpath(fpath, src_dir)
                      arcname = "./" + relpath
                      files_to_add.append((fpath, arcname))
                      parts = arcname.split("/")
                      for i in range(2, len(parts)):
                          all_dirs.add("/".join(parts[:i]))
              # Add directories first
              for dirpath in sorted(all_dirs):
                  dinfo = tarfile.TarInfo(name=dirpath)
                  dinfo.type = tarfile.DIRTYPE
                  dinfo.mode = 0o755
                  dinfo.uid = 0; dinfo.gid = 0; dinfo.uname = ""; dinfo.gname = ""; dinfo.mtime = 0
                  tar.addfile(dinfo)
              # Add files
              for fpath, arcname in sorted(files_to_add, key=lambda x: x[1]):
                  info = tar.gettarinfo(fpath, arcname=arcname)
                  info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
                  with open(fpath, "rb") as f:
                      tar.addfile(info, f)
          data_tgz = data_buf.getvalue()

          # Outer: gzip-compressed tar containing debian-binary, control.tar.gz, data.tar.gz
          # GL.iNet OpenWrt 21.02 uses gzip+tar format (NOT ar archive format)
          ipk_buf = io.BytesIO()
          tar_obj = tarfile.open(fileobj=ipk_buf, mode="w")
          for name, data in [("./debian-binary", debian_binary),
                             ("./control.tar.gz", control_tgz),
                             ("./data.tar.gz", data_tgz)]:
              info = tarfile.TarInfo(name=name)
              info.size = len(data)
              info.mode = 0o644
              info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
              tar_obj.addfile(info, io.BytesIO(data))
          tar_obj.close()
          outer_tar = ipk_buf.getvalue()

          # Gzip compress with mtime=0, os=3 (Unix), XFL=0 (default compression)
          ipk_buf2 = io.BytesIO()
          with gzip.GzipFile(fileobj=ipk_buf2, mode="wb", mtime=0, compresslevel=6) as gz:
              gz.write(outer_tar)
          ipk_data = ipk_buf2.getvalue()
          ipk_data = ipk_data[:9] + b"\x03" + ipk_data[10:]  # OS=3 (Unix)

          with open(output_ipk, "wb") as f:
              f.write(ipk_data)
          print(f"Built: {output_ipk} ({len(ipk_data)} bytes)")

          with open("/tmp/ipk_path.txt", "w") as f:
              f.write(output_ipk)
          PYEOF

      - name: Create manual install archive
        run: |
          mkdir -p /tmp/artifacts
          IPK_PATH=$(cat /tmp/ipk_path.txt)
          cp "$IPK_PATH" /tmp/artifacts/
          tar -czf /tmp/artifacts/luci-app-gl-dpi-logs-${{ env.PKG_RELEASE }}-manual.tar.gz \
            -C /tmp/pkgbuild usr etc

      - name: Write PKGINFO (OpenWrt 25.xx APK)
        run: |
          printf 'pkgname = luci-app-gl-dpi-logs\npkgver = %s-r0\npkgdesc = LuCI app for exporting DPI and content filtering logs from GL.iNet routers\nurl = https://github.com/wickedyoda/luci-app-gl-dpi-logs\nlicense = GPL-3.0-or-later\narch = all\ndepends = luci-base\ndepends = luci-lib-jsonc\nmaintainer = WickedYoda\n' "${BUILD_VERSION}" > /tmp/pkgbuild/.PKGINFO
          printf 'post-install() {\n\tmkdir -p /usr/lib/lua/luci/view/gl-dpi-logs\n\tmkdir -p /usr/lib/lua/luci/model/cbi/gl-dpi-logs\n\texit 0\n}\n' > /tmp/pkgbuild/.INSTALL

      - name: Build APK (Alpine format for OpenWrt 25.xx)
        run: |
          python3 << 'PYEOF'
          import os, tarfile, io, gzip

          build_version = os.environ["BUILD_VERSION"]
          output_apk = f"/tmp/luci-app-gl-dpi-logs-{build_version}-r0_all.apk"
          src_dir = "/tmp/pkgbuild"

          # Read .PKGINFO and .INSTALL
          with open(f"{src_dir}/.PKGINFO", "r") as f:
              pkginfo = f.read().encode("utf-8")
          with open(f"{src_dir}/.INSTALL", "r") as f:
              install = f.read().encode("utf-8")

          # Collect files for manifest
          manifest_lines = []
          all_dirs = set()
          files_to_add = []
          for root, dirs, files in os.walk(src_dir):
              for fname in sorted(files):
                  if fname in ("control", "postinst", ".PKGINFO", ".INSTALL"):
                      continue
                  fpath = os.path.join(root, fname)
                  relpath = os.path.relpath(fpath, src_dir)
                  arcname = relpath.lstrip("/")
                  manifest_lines.append(arcname)
                  files_to_add.append((fpath, arcname))
                  parts = arcname.split("/")
                  for i in range(1, len(parts)):
                      all_dirs.add("/".join(parts[:i]))
          manifest = "\n".join(sorted(manifest_lines)) + "\n"

          # Build uncompressed tar
          apk_buf = io.BytesIO()
          with tarfile.open(fileobj=apk_buf, mode="w") as tar:
              # .PKGINFO
              info = tarfile.TarInfo(name=".PKGINFO")
              info.size = len(pkginfo)
              info.mode = 0o644
              info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
              tar.addfile(info, io.BytesIO(pkginfo))
              # .INSTALL
              info = tarfile.TarInfo(name=".INSTALL")
              info.size = len(install)
              info.mode = 0o755
              info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
              tar.addfile(info, io.BytesIO(install))
              # .MANIFEST
              info = tarfile.TarInfo(name=".MANIFEST")
              info.size = len(manifest.encode())
              info.mode = 0o644
              info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
              tar.addfile(info, io.BytesIO(manifest.encode()))
              # Directories
              for dirpath in sorted(all_dirs):
                  dinfo = tarfile.TarInfo(name=dirpath)
                  dinfo.type = tarfile.DIRTYPE
                  dinfo.mode = 0o755
                  dinfo.uid = 0; dinfo.gid = 0; dinfo.uname = ""; dinfo.gname = ""; dinfo.mtime = 0
                  tar.addfile(dinfo)
              # Files
              for fpath, arcname in sorted(files_to_add, key=lambda x: x[1]):
                  info = tar.gettarinfo(fpath, arcname=arcname)
                  info.uid = 0; info.gid = 0; info.uname = ""; info.gname = ""; info.mtime = 0
                  with open(fpath, "rb") as f:
                      tar.addfile(info, f)

          # Gzip compress with mtime=0, OS=3 (Unix)
          apk_data = apk_buf.getvalue()
          apk_buf2 = io.BytesIO()
          with gzip.GzipFile(fileobj=apk_buf2, mode="wb", mtime=0, compresslevel=6) as gz:
              gz.write(apk_data)
          apk_data = apk_buf2.getvalue()
          apk_data = apk_data[:9] + b"\x03" + apk_data[10:]  # OS=3 (Unix)

          with open(output_apk, "wb") as f:
              f.write(apk_data)
          print(f"Built: {output_apk} ({os.path.getsize(output_apk)} bytes)")
          with open("/tmp/apk_path.txt", "w") as f:
              f.write(output_apk)
          # Verify
          with tarfile.open(output_apk, "r:gz") as tar:
              names = tar.getnames()
              print(f"Entries: {len(names)}")
              for n in sorted(names):
                  print(f"  {n}")
          PYEOF

      - name: Copy APK to artifacts
        run: |
          APK_PATH=$(cat /tmp/apk_path.txt)
          cp "$APK_PATH" /tmp/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-artifact
          path: /tmp/artifacts/

      - name: Create Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/*
          tag_name: v${{ env.PKG_VERSION }}
          overwrite_files: true

      - name: Create Release (push to main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ipk-build-push
          path: /tmp/artifacts/
          if-no-files-fall-through: true
