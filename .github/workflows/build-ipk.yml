name: Build OpenWrt Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up env
        run: |
          # Determine build number: count existing v1.NN tags, increment
          EXISTING=$(git tag --list 'v1.[0-9][0-9]' | wc -l)
          BUILD=$((EXISTING + 1))
          BUILD_PADDED=$(printf "v1.%02d" $BUILD)
          echo "PKG_RELEASE=${BUILD_PADDED}" >> $GITHUB_ENV
          echo "BUILD_VERSION=1.0.${BUILD}" >> $GITHUB_ENV
          echo "PKG_VERSION=${BUILD_PADDED}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Create package directory structure
        run: |
          mkdir -p /tmp/pkgbuild/DEBIAN
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/controller
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/model/cbi/gl-dpi-logs
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/view/gl-dpi-logs
          mkdir -p /tmp/pkgbuild/usr/share/luci/menu.d
          mkdir -p /tmp/pkgbuild/etc/config

          cp luasrc/controller/gl_dpi_logs.lua /tmp/pkgbuild/usr/lib/lua/luci/controller/
          cp luasrc/model/cbi/gl-dpi-logs/overview.lua /tmp/pkgbuild/usr/lib/lua/luci/model/cbi/gl-dpi-logs/
          cp luasrc/view/gl-dpi-logs/overview.htm /tmp/pkgbuild/usr/lib/lua/luci/view/gl-dpi-logs/
          cp root/usr/share/luci/menu.d/gl-dpi-logs.json /tmp/pkgbuild/usr/share/luci/menu.d/
          cp files/etc/config/gl_dpi_logs /tmp/pkgbuild/etc/config/

      - name: Write control file
        run: |
          printf 'Package: luci-app-gl-dpi-logs-%s\nVersion: %s\nSection: luci\nArchitecture: all\nMaintainer: WickedYoda\nDepends: luci-base, luci-lib-jsonc\nDescription: LuCI app for exporting DPI and content filtering logs from GL.iNet routers\n This app reads QoS and content protection statistics from GL.iNet routers,\n displays them in the LuCI web UI, and allows export to JSON or CSV format.\n' "${PKG_RELEASE}" "${BUILD_VERSION}" > /tmp/pkgbuild/DEBIAN/control

      - name: Build IPK (Python ar archive builder)
        run: |
          python3 << 'PYEOF'
          import struct, os, tarfile, io, shutil

          pkg_release = os.environ["PKG_RELEASE"]
          build_version = os.environ["BUILD_VERSION"]
          src_dir = "/tmp/pkgbuild"
          output_ipk = f"/tmp/luci-app-gl-dpi-logs-{pkg_release}_{build_version}_all.ipk"

          # Read control file
          with open(f"{src_dir}/DEBIAN/control", "r") as f:
              control_content = f.read().encode("utf-8")

          # debian-binary: must be "2.0\n" (4 bytes)
          debian_binary = b"2.0\n"

          # Build control.tar.gz - control at root, no ./ prefix
          control_tgz_buf = io.BytesIO()
          with tarfile.open(fileobj=control_tgz_buf, mode="w:gz") as tar:
              info = tarfile.TarInfo(name="control")
              info.size = len(control_content)
              info.mode = 0o644
              info.uid = 0
              info.gid = 0
              info.uname = ""
              info.gname = ""
              info.mtime = 0
              tar.addfile(info, io.BytesIO(control_content))
          control_tgz = control_tgz_buf.getvalue()

          # Build data.tar.gz - files at root, no ./ prefix
          data_tgz_buf = io.BytesIO()
          with tarfile.open(fileobj=data_tgz_buf, mode="w:gz") as tar:
              for root, dirs, files in os.walk(src_dir):
                  for fname in files:
                      fpath = os.path.join(root, fname)
                      arcname = os.path.relpath(fpath, src_dir)
                      # Ensure uid/gid are 0 for determinism
                      tar.add(fpath, arcname=arcname)
              # Reset ownership in the tar
          data_tgz = data_tgz_buf.getvalue()

          # Build ar archive manually
          def make_ar_entry(name, data):
              """Create ar entry: 16-byte name, 12 mtime, 6 uid, 6 gid, 8 mode, 10 size, 2 end"""
              name_field = name.encode("ascii").ljust(16, b" ")
              mtime_field = b"0".ljust(12, b" ")
              uid_field = b"0".ljust(6, b" ")
              gid_field = b"0".ljust(6, b" ")
              mode_field = b"644     "[:8]  # 8 bytes for mode field
              size_field = str(len(data)).encode("ascii").ljust(10, b" ")
              end_magic = b"`\n"
              header = name_field + mtime_field + uid_field + gid_field + mode_field + size_field + end_magic
              result = header + data
              # ar requires even-length entries (pad with \n if odd)
              if len(data) % 2 == 1:
                  result += b"\n"
              return result

          ar_magic = b"!<arch>\n"
          ipk_data = ar_magic
          ipk_data += make_ar_entry("debian-binary", debian_binary)
          ipk_data += make_ar_entry("control.tar.gz", control_tgz)
          ipk_data += make_ar_entry("data.tar.gz", data_tgz)

          with open(output_ipk, "wb") as f:
              f.write(ipk_data)
          print(f"Built: {output_ipk} ({len(ipk_data)} bytes)")

          # Also store path for artifact step
          with open("/tmp/ipk_path.txt", "w") as f:
              f.write(output_ipk)
          PYEOF

      - name: Create manual install archive
        run: |
          mkdir -p /tmp/artifacts
          IPK_PATH=$(cat /tmp/ipk_path.txt)
          cp "$IPK_PATH" /tmp/artifacts/
          tar -czf /tmp/artifacts/luci-app-gl-dpi-logs-${{ env.PKG_RELEASE }}-manual.tar.gz \
            -C /tmp/pkgbuild usr etc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-artifact
          path: /tmp/artifacts/

      - name: Create Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/*
          tag_name: v${{ env.PKG_VERSION }}
          overwrite_files: true
