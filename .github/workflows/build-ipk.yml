name: Build OpenWrt Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up env
        run: |
          # Extract version from most recent tag (format: v1.XX)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.00")
          echo "BASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "PKG_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev zlib1g-dev gawk flex \
            quilt git libssl-dev xxd rsync unzip python3 dpkg-dev

      - name: Create package directory structure
        run: |
          mkdir -p /tmp/pkgbuild/DEBIAN
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/controller
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/model/cbi/gl-dpi-logs
          mkdir -p /tmp/pkgbuild/usr/lib/lua/luci/view/gl-dpi-logs
          mkdir -p /tmp/pkgbuild/usr/share/luci/menu.d
          mkdir -p /tmp/pkgbuild/etc/config

          cp luasrc/controller/gl_dpi_logs.lua /tmp/pkgbuild/usr/lib/lua/luci/controller/
          cp luasrc/model/cbi/gl-dpi-logs/overview.lua /tmp/pkgbuild/usr/lib/lua/luci/model/cbi/gl-dpi-logs/
          cp luasrc/view/gl-dpi-logs/overview.htm /tmp/pkgbuild/usr/lib/lua/luci/view/gl-dpi-logs/
          cp root/usr/share/luci/menu.d/gl-dpi-logs.json /tmp/pkgbuild/usr/share/luci/menu.d/
          cp files/etc/config/gl_dpi_logs /tmp/pkgbuild/etc/config/

      - name: Write control file
        run: |
          printf 'Package: luci-app-gl-dpi-logs-v%s\nVersion: 1.%s\nSection: luci\nArchitecture: all\nMaintainer: WickedYoda\nDepends: luci-base, luci-lib-jsonc\nDescription: LuCI app for exporting DPI and content filtering logs from GL.iNet routers\n This app reads QoS and content protection statistics from GL.iNet routers,\n displays them in the LuCI web UI, and allows export to JSON or CSV format.\n' "${PKG_VERSION}" "${PKG_VERSION}" > /tmp/pkgbuild/DEBIAN/control

      - name: Build IPK with dpkg-deb
        run: |
          cd /tmp
          dpkg-deb -Z gzip --build --root-owner-group /tmp/pkgbuild \
            /tmp/luci-app-gl-dpi-logs-v${PKG_VERSION}_all.ipk

      - name: Create manual install archive
        run: |
          mkdir -p /tmp/artifacts
          cp /tmp/luci-app-gl-dpi-logs-v${PKG_VERSION}_all.ipk /tmp/artifacts/
          tar -czf /tmp/artifacts/luci-app-gl-dpi-logs-v${PKG_VERSION}-manual.tar.gz \
            -C /tmp/pkgbuild usr etc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-artifact
          path: /tmp/artifacts/

      - name: Create Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/*
          tag_name: v${{ env.PKG_VERSION }}